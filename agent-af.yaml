name: millennial-mum-decomposed
description: >
  Decomposed Millennial Mum: a triage orchestrator (router-as-tools) coordinating
  four domain specialists (Kitchen, Planner, Admin & Budget, Health) plus shared
  family memory, built on Microsoft Agent Framework. Each specialist runs on its
  own Foundry catalog model. Helps working parents of small children (ages 0-7)
  with meals, schedules, activities, budgeting, admin, and NHS-grounded health
  guidance.
template:
  kind: hosted
  protocols:
    - name: responses
      version: "2025-03-01"
  startupCommand: python server_af.py
  requirements: requirements-agents.txt
  environment_variables:
    - name: FOUNDRY_PROJECT_ENDPOINT
      description: Azure AI Foundry project endpoint (https://<project>.services.ai.azure.com/...)
    - name: APPLICATIONINSIGHTS_CONNECTION_STRING
      description: Connection string of the App Insights resource linked to the Foundry project (enables end-to-end tracing)
    - name: MM_TRIAGE_MODEL
      description: Foundry deployment name for the triage orchestrator (default gpt-5-mini)
    - name: MM_KITCHEN_MODEL
      description: Foundry deployment name for the Kitchen specialist (default gpt-5-nano)
    - name: MM_PLANNER_MODEL
      description: Foundry deployment name for the Planner specialist (default gpt-5-mini)
    - name: MM_ADMIN_BUDGET_MODEL
      description: Foundry deployment name for the Admin & Budget specialist (default claude-sonnet-5)
    - name: MM_HEALTH_MODEL
      description: Foundry deployment name for the Health specialist (default claude-sonnet-5)
    - name: MM_MEMORY_MODEL
      description: Foundry deployment name for the shared memory service (default gpt-5-nano)
    - name: MM_TRACE_SENSITIVE_DATA
      description: "Set to true to record prompt/response content on traces (default false)"
